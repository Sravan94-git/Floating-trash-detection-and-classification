<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Detection Result</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 40px;
      text-align: center;
    }
    .image-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
    }
    img {
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
    }
    a {
      display: inline-block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Detection Result</h2>
  <div class="image-container">
    <div>
      <p><strong>Original Image</strong></p>
      <img src="{{ url_for('static', filename='uploads/' + input_image) }}" />
    </div>
    <div>
      <p><strong>Detected Image</strong></p>
      <img src="{{ url_for('static', filename='uploads/' + result_image) }}" />
    </div>
  </div>
  <a href="{{ url_for('index') }}">&#8592; Try another image</a>
</body>
</html>
